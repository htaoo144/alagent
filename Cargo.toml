[package]
name = "alagent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.41.1",features = ["full"] }
dotenvy = "0.15.7"
schemars = "1.2.2"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = "0.13.4"
async-trait = "0.1.92"
uuid = { version = "1.24.0",features = ["v4"] }
chrono = "0.4.45"
tiktoken-rs = "0.12.0"
rmcp = { version = "3.1.2",features = ["client","transport-child-process","transport-io","transport-streamable-http-client","transport-streamable-http-client-reqwest","transport-streamable-http-server","server","default","macros"] }
zip = "8.6.0"
base64 = "0.22"
glob = "0.3"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
